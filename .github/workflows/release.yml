# Binaries of mcp-server-aha-aql for Windows and macOS.
#
# A tag vX.Y.Z runs the test suite on Linux, builds the binaries, records
# their build provenance, runs them on macOS and Windows, and then attaches
# them to a GitHub release. The tag must equal VERSION in
# implementation/code/Makefile. A manual run builds the same files and keeps
# them as a workflow artifact, without a release.
#
# Linux packages are not built here: they come from the Open Build Service.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The full test suite. Its test double needs Linux (see INTERFACES of the
  # specification), so it runs here, and a release waits for it.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: implementation/code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: implementation/code/go.mod
          cache: false

      - name: Tests
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 -timeout 20m ./independent_tests/...

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # sign the build provenance
      attestations: write   # store the build provenance
    defaults:
      run:
        shell: bash
        working-directory: implementation/code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: implementation/code/go.mod
          cache: false

      - name: Version
        run: |
          version=$(sed -n 's/^VERSION *:= *//p' Makefile)
          if [ -z "$version" ]; then
            echo "no VERSION in the Makefile" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION $version of the Makefile" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Dependencies
        run: |
          go mod download
          go mod verify

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          dist="$GITHUB_WORKSPACE/dist"
          mkdir -p "$dist"
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="mcp-server-aha-aql-$VERSION-$os-$arch"
            ext=
            [ "$os" = windows ] && ext=.exe
            mkdir -p "$RUNNER_TEMP/$name"
            GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags="-X main.serverVersion=$VERSION" \
              -o "$RUNNER_TEMP/$name/mcp-server-aha-aql$ext" .
            cp LICENSE README.md "$RUNNER_TEMP/$name/"
            if [ "$os" = windows ]; then
              (cd "$RUNNER_TEMP" && zip -qr "$dist/$name.zip" "$name")
            else
              tar -C "$RUNNER_TEMP" -czf "$dist/$name.tar.gz" "$name"
            fi
          done
          cd "$dist"
          sha256sum -- *.zip *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Artifact for the smoke test
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # Runs the binaries that the build job made, the same files as in the
  # release, on the system they are for. No check needs the network. The
  # release waits for it.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
            archive: tar.gz
          - os: windows-latest
            target: windows-amd64
            archive: zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Check and unpack
        run: |
          set -eu
          archive=$(cd dist && ls mcp-server-aha-aql-*-${{ matrix.target }}.${{ matrix.archive }})
          (cd dist && grep -F "  $archive" SHA256SUMS > one.sha256 &&
            if command -v sha256sum > /dev/null; then sha256sum -c one.sha256; else shasum -a 256 -c one.sha256; fi)
          mkdir -p pkg
          if [ "${{ matrix.archive }}" = zip ]; then
            pwsh -NoProfile -Command "Expand-Archive -Path 'dist/$archive' -DestinationPath 'pkg'"
          else
            tar -C pkg -xzf "dist/$archive"
          fi
          bin=$(ls pkg/*/mcp-server-aha-aql*)
          echo "BIN=$bin" >> "$GITHUB_ENV"
          echo "binary: $bin"

      - name: Version
        run: |
          out=$("$BIN" --version)
          echo "$out"
          grep -Eq '^mcp-server-aha-aql [0-9][0-9.]* spec:[0-9a-f]{64}$' <<< "$out"

      - name: Unknown first word
        run: |
          set +e
          err=$("$BIN" bogus 2>&1 > /dev/null); code=$?
          echo "exit $code: $err"
          [ "$code" -eq 2 ] && grep -q "error: unknown transport 'bogus'" <<< "$err"

      - name: Start without an account
        run: |
          set +e
          err=$(env -u AHA_SUBDOMAIN -u AHA_API_KEY "$BIN" stdio < /dev/null 2>&1 > /dev/null); code=$?
          echo "exit $code: $err"
          [ "$code" -eq 2 ] && grep -q 'error: no Aha! account' <<< "$err"

      - name: MCP initialize over stdio
        run: |
          set +e
          req='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}'
          out=$(printf '%s\n' "$req" | AHA_SUBDOMAIN=example AHA_API_KEY=not-a-key "$BIN" stdio); code=$?
          echo "exit $code: $out"
          [ "$code" -eq 0 ] && grep -q '"serverInfo"' <<< "$out" && grep -q '"instructions"' <<< "$out"

      - name: Key file that other users can read
        if: runner.os == 'macOS'
        run: |
          set +e
          key="$PWD/aha-key"
          printf 'not-a-key\n' > "$key" && chmod 644 "$key"
          err=$("$BIN" stdio subdomain=example api-key-file="$key" < /dev/null 2>&1 > /dev/null); code=$?
          echo "exit $code: $err"
          [ "$code" -eq 2 ] && grep -q 'can be read by other users' <<< "$err"

  # A tag becomes a release only when the tests on Linux and the smoke test
  # on macOS and Windows have passed. The files are the ones that the build
  # job made and attested.
  release:
    if: github.ref_type == 'tag'
    needs: [test, build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "mcp-server-aha-aql ${GITHUB_REF_NAME#v}" \
            --notes "Binaries for Windows and macOS, built from $GITHUB_REF_NAME by GitHub Actions. Linux packages are built on the Open Build Service.

          Check a download: sha256sum -c SHA256SUMS, and gh attestation verify <file> --repo $GITHUB_REPOSITORY" \
            dist/*
