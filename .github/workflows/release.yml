# Binaries of mcp-server-aha-aql for Windows and macOS.
#
# A tag vX.Y.Z builds the binaries, records their build provenance and
# attaches them to a GitHub release. The tag must equal VERSION in
# implementation/code/Makefile. A manual run builds the same files and keeps
# them as a workflow artifact, without a release.
#
# Linux packages are not built here: they come from the Open Build Service.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release
      id-token: write       # sign the build provenance
      attestations: write   # store the build provenance
    defaults:
      run:
        shell: bash
        working-directory: implementation/code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: implementation/code/go.mod
          cache: false

      - name: Version
        run: |
          version=$(sed -n 's/^VERSION *:= *//p' Makefile)
          if [ -z "$version" ]; then
            echo "no VERSION in the Makefile" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION $version of the Makefile" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Dependencies
        run: |
          go mod download
          go mod verify

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          dist="$GITHUB_WORKSPACE/dist"
          mkdir -p "$dist"
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="mcp-server-aha-aql-$VERSION-$os-$arch"
            ext=
            [ "$os" = windows ] && ext=.exe
            mkdir -p "$RUNNER_TEMP/$name"
            GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags="-X main.serverVersion=$VERSION" \
              -o "$RUNNER_TEMP/$name/mcp-server-aha-aql$ext" .
            cp LICENSE README.md "$RUNNER_TEMP/$name/"
            if [ "$os" = windows ]; then
              (cd "$RUNNER_TEMP" && zip -qr "$dist/$name.zip" "$name")
            else
              tar -C "$RUNNER_TEMP" -czf "$dist/$name.tar.gz" "$name"
            fi
          done
          cd "$dist"
          sha256sum -- *.zip *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "mcp-server-aha-aql $VERSION" \
            --notes "Binaries for Windows and macOS, built from $GITHUB_REF_NAME by GitHub Actions. Linux packages are built on the Open Build Service.

          Check a download: sha256sum -c SHA256SUMS, and gh attestation verify <file> --repo $GITHUB_REPOSITORY" \
            "$GITHUB_WORKSPACE"/dist/*

      - name: Artifact of a manual run
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-server-aha-aql-${{ env.VERSION }}
          path: dist/

  # The tests have not run on Windows or macOS before. Their results are
  # information for now and do not hold up a release.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    defaults:
      run:
        shell: bash
        working-directory: implementation/code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: implementation/code/go.mod
          cache: false

      - name: Tests
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 -timeout 20m ./independent_tests/...
